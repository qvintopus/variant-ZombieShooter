# LAN Party defaults. Don't edit this file in a game: put the keys you change in lan_party.cfg in the
# project's root folder (next to project.godot). It's read on top of this one by the scripts and the game.
# Plain key=value lines; '#' starts a comment. Values must not hold spaces, except game_title and server_name.

# Folder and firewall names: <prefix>-vlan, <prefix>-vlan-guest, <prefix>-vlan-name, <prefix>-server, ...
prefix=lanparty
# WireGuard interface / NetworkManager connection / Windows tunnel service name (letters, digits; max 15)
vlan_name=lanparty
# The virtual LAN: <vlan_net>.1 is the host, guests pick .2-.254
vlan_net=10.88.0
# WireGuard UDP port
vlan_port=51820
# The game's UDP port (the dedicated server's default; firewall rules on the virtual LAN)
game_port=7777
# Invite and reply codes start with <code_prefix>i2. and <code_prefix>r2.
code_prefix=lp
# Shown in messages and as the UPnP port mapping's description
game_title=Godot game
# Dedicated server defaults
server_name=Server
max_players=8
idle_kick=5
# Extra dedicated-server settings with fixed choices, the first is the default:
# name:choice1,choice2;name2:a,b. The launchers' menus offer them; they reach the server as --name value.
extra_settings=
